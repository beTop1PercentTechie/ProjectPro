# =============================================================
# config.conf
# -------------------------------------------------------------
# WHAT THIS FILE IS:
#   The single, central settings file for the whole project.
#   Every script "sources" this file before doing anything else,
#   which loads all the variables below into that script.
#
# WHY IT EXISTS:
#   So thresholds, the alert email, and file paths can be changed
#   in ONE place, without editing any script's logic.
#
# HOW TO EDIT:
#   Change a value below and save. No script needs to change.
# =============================================================
 
# --- Alert thresholds (percentage for CPU/RAM/DISK/SWAP, count for LOAD) ---
CPU_THRESHOLD=80
RAM_THRESHOLD=85
DISK_THRESHOLD=90
SWAP_THRESHOLD=80
LOAD_THRESHOLD=4
 
# --- How far past a threshold counts as CRITICAL instead of WARNING ---
# Example: CPU_THRESHOLD=80 and CRITICAL_MARGIN=10 means:
#   80-89%  -> WARNING
#   90%+    -> CRITICAL
CRITICAL_MARGIN=10
 
# --- Where alert / report emails are sent ---
EMAIL="kd.codegeek@gmail.com"
 
# --- Folder & file paths used by every script ---
BASE_DIR="/home/ubuntu/ProjectPro/Devops+Cloud/Linux_Core/Beginner/Linux_Health_Monitoring_System"
LOG_FILE="$BASE_DIR/logs/health.log"
REPORT_DIR="$BASE_DIR/reports"

