#!/usr/bin/env bash
# backup.conf - Settings for the Backup Automation Tool.
# Sourced as a shell script by lib/backup-functions.sh:load_config - keep
# it valid bash (KEY=value, no spaces around '='). Anything left out falls
# back to the default defined in load_config().

# --- What to back up -----------------------------------------------------
# Comma-separated list of directories to back up. No trailing slashes.
# Start with the safe test sandbox (see docs/TESTING.md) before pointing
# this at real system directories like /etc or /home.
SOURCE_DIRS="/home/ubuntu/backup-lab/source/home,/home/ubuntu/backup-lab/source/etc,/home/ubuntu/backup-lab/source/var-www,/home/ubuntu/backup-lab/source/opt"

# --- Where backups live ---------------------------------------------------
BACKUP_ROOT="$BAT_HOME/backups"
LOG_DIR="$BAT_HOME/logs"
REPORT_DIR="$BAT_HOME/reports"

# --- Retention policy -------------------------------------------------------
# Keep this many of the newest backups per source directory; older ones
# beyond this count are deleted automatically after each successful run.
RETENTION_COUNT=7

# --- Safety checks ----------------------------------------------------------
# Refuse to start a backup if the destination filesystem has less than
# this many megabytes free.
MIN_FREE_DISK_MB=200

# Prevents two backup runs from overlapping (e.g. a slow manual run
# colliding with the scheduled cron run).
LOCK_FILE="$BAT_HOME/.backup.lock"

# --- Optional: exclude patterns --------------------------------------------
# Comma-separated glob patterns passed to tar --exclude. Leave empty to
# back up everything under each source directory.
TAR_EXCLUDES="*.tmp,*.log,node_modules,.git"

# --- Optional advanced feature: rsync staging --------------------------------
# When true, each source is first synced into RSYNC_STAGING_DIR with rsync
# (fast, incremental) before tar+gzip archives the staged copy. This is
# off by default - tar+gzip alone is simpler and sufficient for most uses.
# See docs/ARCHITECTURE.md for when rsync staging is actually worth it.
USE_RSYNC_STAGING=false
RSYNC_STAGING_DIR="$BAT_HOME/.rsync-staging"
