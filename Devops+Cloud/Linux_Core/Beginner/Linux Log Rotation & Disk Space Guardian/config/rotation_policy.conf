# rotation_policy.conf - Per-path log rotation rules, checked in order; the
# first matching rule wins. A file that matches no rule falls back to the
# DEFAULT_* settings in config/guardian.conf.
#
# Format (pipe-delimited, comments and blank lines ignored):
#   GLOB_PATTERN|MAX_SIZE_MB|MAX_AGE_DAYS|KEEP_COUNT|COMPRESS
#
#   GLOB_PATTERN  - a shell glob matched against the full file path (bash
#                   'extglob'-style globs are not needed; plain * and ? are
#                   enough). Quote-free, no pipe characters allowed.
#   MAX_SIZE_MB   - rotate once the file exceeds this size (0 = ignore size)
#   MAX_AGE_DAYS  - rotate once the file is older than this, even if small
#                   (0 = ignore age)
#   KEEP_COUNT    - how many rotated+compressed copies to retain (oldest
#                   beyond this count are deleted)
#   COMPRESS      - true|false - gzip the rotated copy
#
# A rule with both MAX_SIZE_MB=0 and MAX_AGE_DAYS=0 never triggers - useful
# to explicitly exempt a path by putting it before a broader wildcard rule.

/var/log/nginx/*.log|100|7|5|true
/var/log/apache2/*.log|100|7|5|true
/var/log/mysql/*.log|200|14|5|true
/var/log/myapp/*.log|200|14|10|true
/var/log/syslog|150|14|5|true
/var/log/*.log|100|14|5|true
