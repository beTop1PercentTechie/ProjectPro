#!/usr/bin/env bash
# guardian.conf - Main Guardian configuration.
# Sourced as a shell script by lib/core/config_loader.sh - keep it valid bash
# (KEY=value, no spaces around '='). Any setting left out falls back to the
# default defined in config_loader.sh.

# --- Output locations ----------------------------------------------------------
DATA_DIR="$GUARDIAN_HOME/data"
LOG_DIR="$GUARDIAN_HOME/logs"
REPORT_DIR="$GUARDIAN_HOME/logs/reports"
ROTATION_POLICY_FILE="$GUARDIAN_HOME/config/rotation_policy.conf"

# --- Monitored mount points ------------------------------------------------------
# "auto" = every local, real filesystem reported by df (excludes tmpfs/overlay/etc).
# Or a comma-separated list, e.g. "/,/var,/home"
MONITORED_MOUNTS="auto"

# --- Static usage thresholds (percent) --------------------------------------------
DISK_WARN_THRESHOLD=75
DISK_CRIT_THRESHOLD=90

# --- Growth-rate trend detection ---------------------------------------------------
# History window used to compute the current growth rate.
GROWTH_SAMPLE_WINDOW_MIN=60
# Fire a preemptive alert if the projected time-to-full drops below these,
# regardless of the current usage percentage.
FORECAST_WARN_HOURS=24
FORECAST_CRITICAL_HOURS=6
# Need at least this many samples in the window before trusting a forecast.
MIN_SAMPLES_FOR_FORECAST=3
# How long raw history samples are kept before being pruned.
HISTORY_RETENTION_DAYS=30

# --- Space-hog scanning (du/find) -------------------------------------------------
# Comma-separated list of directories to scan for top consumers.
SCAN_PATHS="/var/log,/home,/tmp,/var/tmp,/opt"
TOP_N_CONSUMERS=10
LARGE_FILE_SIZE_MB=100
DU_MAX_DEPTH=3

# --- Log rotation defaults ---------------------------------------------------------
# Used only when no rule in rotation_policy.conf matches a file.
DEFAULT_MAX_SIZE_MB=100
DEFAULT_MAX_AGE_DAYS=14
DEFAULT_KEEP_COUNT=5
DEFAULT_COMPRESS=true

# Skip rotating a file modified within this many seconds (avoids truncating
# a file that is actively being written to right now).
ROTATION_QUIET_PERIOD_SEC=30

# When true, rotation logic logs what it *would* do without touching any file.
DRY_RUN=false

# --- Alerting --------------------------------------------------------------------------
ENABLE_EMAIL_ALERT=false
ALERT_EMAIL_TO="ops-team@example.com"
ALERT_EMAIL_FROM="guardian@$(hostname -f 2>/dev/null || hostname)"

ENABLE_SLACK_ALERT=false
SLACK_WEBHOOK_URL=""

ENABLE_TELEGRAM_ALERT=false
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# Minimum minutes between two alerts for the same mount, so a frequent
# monitoring cadence (e.g. every 5 minutes) doesn't spam the channel.
ALERT_COOLDOWN_MIN=60

# --- Reports -----------------------------------------------------------------------------
REPORT_FORMATS="txt,json"
REPORT_RETENTION_DAYS=30
