# compliance_rules.conf - Toggle individual CIS-style compliance checks on/off.
# Format: RULE_ID=true|false
# Consumed by lib/modules/08_compliance_check.sh - each RULE_ID maps to one
# check function (see docs/MODULES.md for the full mapping).

# Password & authentication policy
CHECK_PASSWORD_MAX_DAYS=true
CHECK_PASSWORD_MIN_LENGTH=true
CHECK_PASSWORD_COMPLEXITY=true
CHECK_EMPTY_PASSWORDS=true
CHECK_ROOT_LOGIN_RESTRICTED=true

# Filesystem & permissions
CHECK_WORLD_WRITABLE_FILES=true
CHECK_SUID_SGID_FILES=true
CHECK_CRITICAL_FILE_PERMISSIONS=true
CHECK_UNOWNED_FILES=true

# Network & services
CHECK_FIREWALL_ENABLED=true
CHECK_UNNECESSARY_SERVICES=true
CHECK_SSH_HARDENING=true

# Auditing & logging
CHECK_AUDITD_RUNNING=false
CHECK_LOG_PERMISSIONS=true

# System integrity
CHECK_AUTOMATIC_UPDATES=true
CHECK_UNUSED_ACCOUNTS=true
