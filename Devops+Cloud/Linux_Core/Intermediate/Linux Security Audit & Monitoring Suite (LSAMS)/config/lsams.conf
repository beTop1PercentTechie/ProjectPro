#!/usr/bin/env bash
# lsams.conf - Main LSAMS configuration.
# Sourced as a shell script by lib/core/config_loader.sh - keep it valid bash
# (KEY=value, no spaces around '='). Any setting left out falls back to the
# default defined in config_loader.sh.

# --- Output locations --------------------------------------------------------
REPORT_DIR="$LSAMS_HOME/reports"
LOG_DIR="$LSAMS_HOME/logs"

# --- Report formats: comma-separated list of txt,html,json -------------------
REPORT_FORMATS="txt,html,json"

# Delete generated reports older than this many days (0 disables cleanup)
REPORT_RETENTION_DAYS=30

# --- System health thresholds (percent) ---------------------------------------
CPU_WARN_THRESHOLD=80
MEM_WARN_THRESHOLD=80
DISK_WARN_THRESHOLD=80
DISK_CRIT_THRESHOLD=90

# --- Authentication analysis ---------------------------------------------------
# Flag an IP as a brute-force source after this many failed logins...
FAILED_LOGIN_THRESHOLD=5
# ...within this many minutes.
FAILED_LOGIN_WINDOW_MIN=10

# Flag local accounts with no login for this many days as inactive.
ACCOUNT_INACTIVE_DAYS=90

# --- Scoring weights (points deducted per finding of that severity) -----------
SCORE_CRITICAL=15
SCORE_HIGH=10
SCORE_MEDIUM=5
SCORE_LOW=2

# --- Alerting ------------------------------------------------------------------
# Only fire alerts when the computed security score is below this value.
ALERT_MIN_SCORE=70

ENABLE_EMAIL_ALERT=true
ALERT_EMAIL_TO="chandrakanta.s@upgradsot.com"
ALERT_EMAIL_FROM="lsams@$(hostname -f 2>/dev/null || hostname)"

ENABLE_SLACK_ALERT=false
SLACK_WEBHOOK_URL=""

ENABLE_TELEGRAM_ALERT=false
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""
