# ==========================================
# SSL MONITOR CONFIGURATION
# ==========================================

# Website domain
DOMAIN="kumardevops.online"

# Let's Encrypt certificate
CERTIFICATE="/etc/letsencrypt/live/kumardevops.online/fullchain.pem"

# Certificate monitoring thresholds
WARNING_DAYS=30
CRITICAL_DAYS=7
RENEWAL_DAYS=30

# Log file
LOG_FILE="/home/ubuntu/ssl-monitor/logs/ssl-monitor.log"

# Demonstration mode
DEMO_MODE=true
DEMO_REMAINING_DAYS=6
